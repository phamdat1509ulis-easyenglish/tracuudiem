<!DOCTYPE html>
<html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Tra cứu điểm kiểm tra</title>
<style>
*{box-sizing:border-box}:root{--blue-900:#174a78;--blue-800:#205d91;--blue-700:#2f73aa;--blue-500:#69a9d8;--text:#18364f;--muted:#66829a;--danger:#b44747;--success:#27765a;--shadow:0 24px 70px rgba(48,108,151,.18)}
body{margin:0;min-height:100vh;font-family:Inter,"Segoe UI",Roboto,Arial,sans-serif;color:var(--text);background:radial-gradient(circle at 15% 15%,rgba(255,255,255,.95) 0 8%,transparent 28%),radial-gradient(circle at 85% 85%,rgba(169,212,239,.55) 0 8%,transparent 30%),linear-gradient(135deg,#f7fcff 0%,#deeffb 42%,#c5e4f7 100%);display:flex;align-items:center;justify-content:center;padding:34px 18px}
.page{width:min(980px,100%)}.header{text-align:center;margin-bottom:24px}.eyebrow{display:inline-block;margin-bottom:10px;padding:7px 14px;border:1px solid rgba(47,115,170,.18);border-radius:999px;background:rgba(255,255,255,.55);color:var(--blue-700);font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}h1{margin:0;color:var(--blue-900);font-size:clamp(28px,5vw,44px);line-height:1.1;letter-spacing:-.03em}.subtitle{max-width:650px;margin:12px auto 0;color:var(--muted);font-size:15px;line-height:1.7}.card{background:rgba(255,255,255,.88);border:1px solid rgba(255,255,255,.92);border-radius:28px;box-shadow:var(--shadow);backdrop-filter:blur(12px);overflow:hidden}.form-wrap{padding:30px}.form-grid{display:grid;grid-template-columns:1.4fr .8fr;gap:18px}.field{display:flex;flex-direction:column;gap:8px}label{font-size:13px;font-weight:750;color:var(--blue-800)}input{width:100%;height:50px;padding:0 15px;border:1px solid #c8deed;border-radius:14px;outline:none;background:rgba(248,252,255,.95);color:var(--text);font-size:16px;transition:.2s ease}input:focus{border-color:var(--blue-500);background:#fff;box-shadow:0 0 0 4px rgba(105,169,216,.12)}.captcha-area{margin-top:20px;padding:18px;border-radius:18px;background:linear-gradient(135deg,#f3faff,#e4f3fc);border:1px solid #cfe6f4}.captcha-title{font-size:13px;font-weight:750;color:var(--blue-800);margin-bottom:10px}.captcha-row{display:grid;grid-template-columns:170px 1fr 90px;gap:12px;align-items:center}.captcha-code{min-height:50px;display:flex;align-items:center;justify-content:center;border:1px dashed #7cb2d6;border-radius:14px;background:repeating-linear-gradient(-45deg,rgba(255,255,255,.9) 0 8px,rgba(224,242,252,.85) 8px 16px);color:var(--blue-900);font-family:"Courier New",monospace;font-size:25px;font-weight:800;letter-spacing:7px;user-select:none}.refresh{height:50px;border:1px solid #b8d7eb;border-radius:14px;background:#fff;color:var(--blue-700);font-weight:750;cursor:pointer}.refresh:hover{background:#f4faff}.captcha-status{min-height:20px;margin-top:8px;font-size:12px;color:var(--muted)}.captcha-status.ok{color:var(--success);font-weight:700}.captcha-status.bad{color:var(--danger);font-weight:700}.actions{margin-top:20px}#searchBtn{width:100%;height:54px;border:0;border-radius:16px;color:#fff;background:linear-gradient(135deg,#67a9d9,#2f73aa);font-size:16px;font-weight:800;cursor:pointer;box-shadow:0 12px 28px rgba(47,115,170,.23);transition:.2s}#searchBtn:not(:disabled):hover{transform:translateY(-1px)}#searchBtn:disabled{cursor:not-allowed;opacity:.38;box-shadow:none}.hint{margin-top:10px;color:var(--muted);font-size:12px;text-align:center}.result-zone{display:none;border-top:1px solid #e2eef6;background:linear-gradient(180deg,rgba(244,250,254,.8),rgba(255,255,255,.98));padding:26px 30px 32px}.result-zone.show{display:block;animation:rise .28s ease-out}@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}.result-head{display:flex;gap:16px;align-items:center;justify-content:space-between}.student-name{margin:0;font-size:23px;color:var(--blue-900)}.student-meta{margin-top:6px;color:var(--muted);font-size:13px}.total-box{min-width:150px;text-align:center;padding:16px;border-radius:17px;background:linear-gradient(135deg,#e4f4fe,#cbe9fa);border:1px solid #b9ddf2}.total-label{display:block;color:var(--blue-700);font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.09em}.total-value{display:block;margin-top:7px;color:var(--blue-900);font-size:30px;font-weight:900}.error-box{padding:16px 18px;border:1px solid #efcccc;border-radius:14px;background:#fff7f7;color:#954343;font-size:14px}.footer{text-align:center;margin-top:16px;color:#728da2;font-size:12px}@media(max-width:680px){body{padding:22px 12px;align-items:flex-start}.form-wrap,.result-zone{padding-left:18px;padding-right:18px}.form-grid,.captcha-row{grid-template-columns:1fr}.refresh{width:100%}.result-head{flex-direction:column;align-items:stretch}.total-box{width:100%}}
</style></head><body><main class="page"><header class="header"><div class="eyebrow">Hệ thống tra cứu cá nhân</div><h1>Tra cứu điểm kiểm tra</h1><p class="subtitle">Nhập đúng họ và tên, mã số cá nhân và dãy số xác nhận để xem kết quả.</p></header><section class="card"><div class="form-wrap"><div class="form-grid"><div class="field"><label for="fullName">Họ và tên</label><input id="fullName" type="text" autocomplete="off" placeholder="Ví dụ: Nguyễn Văn An"></div><div class="field"><label for="studentCode">Mã số</label><input id="studentCode" type="text" inputmode="numeric" autocomplete="off" placeholder="Nhập mã số"></div></div><div class="captcha-area"><div class="captcha-title">Xác nhận dãy số</div><div class="captcha-row"><div id="captchaCode" class="captcha-code" aria-label="Dãy số xác nhận"></div><input id="captchaInput" type="text" inputmode="numeric" autocomplete="off" maxlength="5" placeholder="Nhập dãy số bên trái"><button id="refreshCaptcha" class="refresh" type="button">Đổi mã</button></div><div id="captchaStatus" class="captcha-status">Nhập chính xác dãy số để mở nút Tra cứu.</div></div><div class="actions"><button id="searchBtn" type="button" disabled>Tra cứu</button><div class="hint">Thông tin phải khớp đồng thời họ tên và mã số.</div></div></div><div id="resultZone" class="result-zone" aria-live="polite"></div></section><div class="footer">Dữ liệu chỉ hiển thị khi thông tin tra cứu khớp.</div></main>
<script>
const STUDENTS = [{"name": "Phạm Bảo An", "code": "31229", "kt": "7.8"}, {"name": "Lê Phan Hà Anh", "code": "190979", "kt": "9.5"}, {"name": "Lưu Nguyễn Hà Anh", "code": "41209", "kt": "9.8"}, {"name": "Ngô Đăng Việt Anh", "code": "31770", "kt": "7.0"}, {"name": "Ngô Lê Hải Anh", "code": "28035", "kt": "7.3"}, {"name": "Nguyễn Hải Anh", "code": "15069", "kt": "8.8"}, {"name": "Nguyễn Ngọc Anh", "code": "72613", "kt": "7.0"}, {"name": "Phạm Nguyễn Vân Anh", "code": "290309", "kt": "9.0"}, {"name": "Nguyễn Đình Ngọc Ánh", "code": "262009", "kt": "9.5"}, {"name": "Mạc Quỳnh Chi", "code": "07056", "kt": "10.0"}, {"name": "Nguyễn Thị Quỳnh Chi", "code": "14257", "kt": "9.5"}, {"name": "Ngô Hương Giang", "code": "14028", "kt": "7.8"}, {"name": "Dương Thị Ngọc Hân", "code": "10108", "kt": "3.5"}, {"name": "Đỗ Nhật Hồng", "code": "07027", "kt": "9.0"}, {"name": "Nguyễn Ngọc Huyền", "code": "28409", "kt": "8.8"}, {"name": "Vũ Thị Minh Huyền", "code": "22069", "kt": "9.8"}, {"name": "Dương Thị Mai Hương", "code": "09059", "kt": "8.3"}, {"name": "Trần Lan Hương", "code": "18112", "kt": "7.8"}, {"name": "Nguyễn Thị Phương Lan", "code": "12049", "kt": "9.3"}, {"name": "Hoàng Thùy Linh", "code": "27629", "kt": "9.8"}, {"name": "Lê Diệu Linh", "code": "061238", "kt": "9.5"}, {"name": "Ngô Phương Linh", "code": "161029", "kt": "7.5"}, {"name": "Nguyễn Hoàng Linh", "code": "907143", "kt": "6.5"}, {"name": "Nguyễn Thục Gia Linh", "code": "12010", "kt": "Không KT"}, {"name": "Trần Hà Linh", "code": "31089", "kt": "9.0"}, {"name": "Dương Hà Ly", "code": "18509", "kt": "2.3"}, {"name": "Trần Thanh Mai", "code": "10106", "kt": "9.0"}, {"name": "Nguyễn Phạm Hồng Minh", "code": "180909", "kt": "6.0"}, {"name": "Phạm Tuấn Minh", "code": "307221", "kt": "7.3"}, {"name": "Phạm Thị Yến Nhi", "code": "02061", "kt": "7.5"}, {"name": "Ngô Thị Oanh", "code": "104769", "kt": "9.5"}, {"name": "Đào Minh Phương", "code": "12579", "kt": "9.5"}, {"name": "Ngô Hà Phương", "code": "012345", "kt": "9.5"}, {"name": "Ngô Thị Minh Thành", "code": "050505", "kt": "8.3"}, {"name": "Ngô Phương Thảo", "code": "09819", "kt": "8.5"}, {"name": "Nguyễn Thị Uyên Thi", "code": "19627", "kt": "9.8"}, {"name": "Trịnh Lê Thịnh", "code": "12345", "kt": "7.8"}, {"name": "Hoàng Bảo Thoa", "code": "15019", "kt": "8.0"}, {"name": "Đỗ Thu Thủy", "code": "13109", "kt": "8.3"}, {"name": "Lê Song Thư", "code": "40110", "kt": "7.0"}, {"name": "Trần Đỗ Nam Trà", "code": "312009", "kt": "7.3"}, {"name": "Lê Minh Trang", "code": "23189", "kt": "9.0"}, {"name": "Nguyễn Thị Kiều Trang", "code": "21968", "kt": "9.8"}, {"name": "Nguyễn Thu Uyên", "code": "290801", "kt": "9.5"}, {"name": "Trần Khánh Vy", "code": "201637", "kt": "7.3"}, {"name": "Nguyễn Thị Thanh Xuân", "code": "01290", "kt": "9.0"}];
const fullName=document.getElementById('fullName'),studentCode=document.getElementById('studentCode'),captchaCode=document.getElementById('captchaCode'),captchaInput=document.getElementById('captchaInput'),refreshCaptcha=document.getElementById('refreshCaptcha'),captchaStatus=document.getElementById('captchaStatus'),searchBtn=document.getElementById('searchBtn'),resultZone=document.getElementById('resultZone');
let currentCaptcha='';
function normalizeName(value){return value.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').replace(/\s+/g,' ').trim().toLowerCase()}
function newCaptcha(){currentCaptcha=String(Math.floor(10000+Math.random()*90000));captchaCode.textContent=currentCaptcha;captchaInput.value='';captchaStatus.textContent='Nhập chính xác dãy số để mở nút Tra cứu.';captchaStatus.className='captcha-status';updateButton()}
function captchaIsCorrect(){return captchaInput.value.trim()===currentCaptcha}
function updateButton(){const valid=captchaIsCorrect();searchBtn.disabled=!(fullName.value.trim().length>=2&&studentCode.value.trim().length>=1&&valid);if(!captchaInput.value.trim()){captchaStatus.textContent='Nhập chính xác dãy số để mở nút Tra cứu.';captchaStatus.className='captcha-status'}else if(valid){captchaStatus.textContent='Dãy số xác nhận chính xác.';captchaStatus.className='captcha-status ok'}else{captchaStatus.textContent='Dãy số chưa đúng.';captchaStatus.className='captcha-status bad'}}
function escapeHtml(value){return String(value).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;')}
function showStudent(student){resultZone.innerHTML=`<div class="result-head"><div><h2 class="student-name">${escapeHtml(student.name)}</h2><div class="student-meta">Mã số: ${escapeHtml(student.code)}</div></div><div class="total-box"><span class="total-label">Điểm KT</span><span class="total-value">${escapeHtml(student.kt)}</span></div></div>`;resultZone.classList.add('show')}
function showError(message){resultZone.innerHTML=`<div class="error-box">${escapeHtml(message)}</div>`;resultZone.classList.add('show')}
function searchStudent(){if(searchBtn.disabled)return;const wantedName=normalizeName(fullName.value),wantedCode=studentCode.value.trim();const student=STUDENTS.find(item=>normalizeName(item.name)===wantedName&&item.code===wantedCode);if(student)showStudent(student);else showError('Không tìm thấy kết quả phù hợp. Vui lòng kiểm tra lại họ và tên hoặc mã số.');newCaptcha()}
[fullName,studentCode,captchaInput].forEach(el=>{el.addEventListener('input',updateButton);el.addEventListener('keydown',event=>{if(event.key==='Enter'&&!searchBtn.disabled)searchStudent()})});refreshCaptcha.addEventListener('click',newCaptcha);searchBtn.addEventListener('click',searchStudent);newCaptcha();
</script></body></html>
