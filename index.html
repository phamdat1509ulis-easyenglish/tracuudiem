<!DOCTYPE html>
<html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Điểm Kiểm Tra Thường Xuyên 2</title>
<style>
*{box-sizing:border-box}
:root{--blue-900:#174a78;--blue-800:#205d91;--blue-700:#2f73aa;--blue-500:#69a9d8;--muted:#66829a;--text:#18364f}
body{margin:0;min-height:100vh;font-family:Inter,"Segoe UI",Roboto,Arial,sans-serif;color:var(--text);background:radial-gradient(circle at 12% 10%,#fff 0%,transparent 30%),linear-gradient(135deg,#f7fcff,#dfeffb 55%,#c5e4f7);display:flex;align-items:center;justify-content:center;padding:38px 18px}
.page{width:min(980px,100%)}.header{text-align:center;margin-bottom:26px}.eyebrow{display:inline-block;margin-bottom:12px;padding:8px 16px;border:1px solid #cce2f2;border-radius:30px;background:#ffffffa8;color:var(--blue-700);font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
h1{margin:0;color:var(--blue-900);font-size:clamp(27px,4vw,43px);line-height:1.18;letter-spacing:-.025em}.subtitle{margin:12px auto 0;max-width:650px;color:var(--muted);font-size:15px;line-height:1.6}
.card{background:#fffffff0;border:1px solid #fff;border-radius:28px;box-shadow:0 24px 70px #306c972e;overflow:hidden}.form-wrap{padding:30px}.form-grid{display:grid;grid-template-columns:1.4fr .8fr;gap:18px}.field{display:flex;flex-direction:column;gap:8px}label{font-size:13px;font-weight:750;color:var(--blue-800)}input{width:100%;height:50px;padding:0 15px;border:1px solid #c8deed;border-radius:14px;outline:0;background:#f8fcff;color:var(--text);font-size:16px;transition:.2s}input:focus{border-color:#69a9d8;background:white;box-shadow:0 0 0 4px #69a9d81f}
.captcha-area{margin-top:20px;padding:18px;border-radius:18px;background:linear-gradient(135deg,#f3faff,#e4f3fc);border:1px solid #cfe6f4}.captcha-title{font-size:13px;font-weight:750;color:var(--blue-800);margin-bottom:10px}.captcha-row{display:grid;grid-template-columns:170px 1fr 90px;gap:12px;align-items:center}.captcha-code{min-height:50px;display:flex;align-items:center;justify-content:center;border:1px dashed #7cb2d6;border-radius:14px;background:repeating-linear-gradient(-45deg,#ffffffe6 0 8px,#e0f2fcd9 8px 16px);color:var(--blue-900);font:800 25px "Courier New",monospace;letter-spacing:7px;user-select:none}.refresh{height:50px;border:1px solid #b8d7eb;border-radius:14px;background:white;color:var(--blue-700);font-weight:750;cursor:pointer}.refresh:hover{background:#f4faff}.captcha-status{min-height:20px;margin-top:8px;font-size:12px;color:var(--muted)}.captcha-status.ok{color:#27765a;font-weight:700}.captcha-status.bad{color:#b44747;font-weight:700}

</style></head><body><main class="page"><header class="header"><div class="eyebrow">Hệ thống tra cứu cá nhân</div><h1>Điểm Kiểm Tra Thường Xuyên 2</h1><p class="subtitle">Nhập đúng họ và tên, mã số cá nhân và dãy số xác nhận để xem kết quả.</p></header><section class="card"><div class="form-wrap"><div class="form-grid"><div class="field"><label for="fullName">Họ và tên</label><input id="fullName" type="text" autocomplete="off" placeholder="Ví dụ: Nguyễn Văn An"></div><div class="field"><label for="studentCode">Mã số</label><input id="studentCode" type="text" inputmode="numeric" autocomplete="off" placeholder="Nhập mã số"></div></div><div class="captcha-area"><div class="captcha-title">Xác nhận dãy số</div><div class="captcha-row"><div id="captchaCode" class="captcha-code" aria-label="Dãy số xác nhận"></div><input id="captchaInput" type="text" inputmode="numeric" autocomplete="off" maxlength="5" placeholder="Nhập dãy số bên trái"><button id="refreshCaptcha" class="refresh" type="button">Đổi mã</button></div><div id="captchaStatus" class="captcha-status">Nhập chính xác dãy số để mở nút Tra cứu.</div></div><div class="actions"><button id="searchBtn" type="button" disabled>Tra cứu</button><div class="hint">Thông tin phải khớp đồng thời họ tên và mã số.</div></div></div><div id="resultZone" class="result-zone" aria-live="polite"></div></section><div class="footer">Dữ liệu chỉ hiển thị khi thông tin tra cứu khớp.</div></main>
<script>

ến Nhi", "code": "02061", "kt": "7.5", "ol": "0.8", "star": "0.9", "total": "9.2", "entered": "8.1", "note": "Vay 11 sao"}, {"name": "Ngô Thị Oanh", "code": "104769", "kt": "9.5", "ol": "0.8", "star": "2.2", "total": "12.5", "entered": "10", "note": "Vay 21 sao"}, {"name": "Đào Minh Phương", "code": "12579", "kt": "9.5", "ol": "0.8", "star": "3.2", "total": "13.5", "entered": "10", "note": ""}, {"name": "Ngô Hà Phương", "code": "012345", "kt": "9.5", "ol": "0.8", "star": "2.8", "total": "13.1", "entered": "10", "note": ""}, {"name": "Ngô Thị Minh Thành", "code": "050505", "kt": "8.3", "ol": "1", "star": "3.5", "total": "12.8", "entered": "10", "note": ""}, {"name": "Ngô Phương Thảo", "code": "09819", "kt": "8.5", "ol": "1", "star": "2.4", "total": "11.9", "entered": "10", "note": ""}, {"name": "Nguyễn Thị Uyên Thi", "code": "19627", "kt": "9.8", "ol": "-1", "star": "2.2", "total": "11.0", "entered": "10", "note": ""}, {"name": "Trịnh Lê Thịnh", "code": "12345", "kt": "7.8", "ol": "1", "star": "0.7", "total": "9.5", "entered": "6.4", "note": "Vay 31 sao"}, {"name": "Hoàng Bảo Thoa", "code": "15019", "kt": "8.0", "ol": "0.8", "star": "2.5", "total": "11.3", "entered": "10", "note": "Vay 10 sao"}, {"name": "Đỗ Thu Thủy", "code": "13109", "kt": "8.3", "ol": "1", "star": "0.3", "total": "9.6", "entered": "8.8", "note": "Vay 8 sao"}, {"name": "Lê Song Thư", "code": "40110", "kt": "7.0", "ol": "-1", "star": "-0.7", "total": "5.3", "entered": "-0.3", "note": "Vay 56 sao"}, {"name": "Trần Đỗ Nam Trà", "code": "312009", "kt": "7.3", "ol": "0.8", "star": "2.5", "total": "10.6", "entered": "5.9", "note": "Vay 47 sao"}, {"name": "Lê Minh Trang", "code": "23189", "kt": "9.0", "ol": "1", "star": "1.7", "total": "11.7", "entered": "10", "note": "Vay 10 sao"}, {"name": "Nguyễn Thị Kiều Trang", "code": "21968", "kt": "9.8", "ol": "0.8", "star": "2.6", "total": "13.2", "entered": "10", "note": "Vay 14 sao"}, {"name": "Nguyễn Thu Uyên", "code": "290801", "kt": "9.5", "ol": "1", "star": const fullName=document.getElementById('fullName'),studentCode=document.getElementById('studentCode'),captchaCode=document.getElementById('captchaCode'),captchaInput=document.getElementById('captchaInput'),refreshCaptcha=document.getElementById('refreshCaptcha'),captchaStatus=document.getElementById('captchaStatus'),searchBtn=document.getElementById('searchBtn'),resultZone=document.getElementById('resultZone');
let currentCaptcha='';
function normalizeName(value){return value.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').replace(/\s+/g,' ').trim().toLowerCase()}
function newCaptcha(){currentCaptcha=String(Math.floor(10000+Math.random()*90000));captchaCode.textContent=currentCaptcha;captchaInput.value='';captchaStatus.textContent='Nhập chính xác dãy số để mở nút Tra cứu.';captchaStatus.className='captcha-status';updateButton()}
function captchaIsCorrect(){return captchaInput.value.trim()===currentCaptcha}
function updateButton(){const valid=captchaIsCorrect();searchBtn.disabled=!(fullName.value.trim().length>=2&&studentCode.value.trim().length>=1&&valid);if(!captchaInput.value.trim()){captchaStatus.textContent='Nhập chính xác dãy số để mở nút Tra cứu.';captchaStatus.className='captcha-status'}else if(valid){captchaStatus.textContent='Dãy số xác nhận chính xác.';captchaStatus.className='captcha-status ok'}else{captchaStatus.textContent='Dãy số chưa đúng.';captchaStatus.className='captcha-status bad'}}
function escapeHtml(value){return String(value).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;')}
function showStudent(student){
 const fields=[['Điểm KT',student.kt],['Điểm OL',student.ol],['Sao',student.star],['Tổng',student.total]];
 const scoreCards=fields.map(([label,value])=>`<div class="score-item"><span class="score-label">${escapeHtml(label)}</span><span class="score-value">${escapeHtml(value)}</span></div>`).join('');
 resultZone.innerHTML=`<div class="result-head"><div><h2 class="student-name">${escapeHtml(student.name)}</h2><div class="student-meta">Mã số: ${escapeHtml(student.code)}</div></div><div class="total-box"><span class="total-label">Điểm nhập</span><span class="total-value">${escapeHtml(student.entered)}</span></div></div><div class="score-grid">${scoreCards}</div>${student.note?`<div class="note"><strong>Lưu ý:</strong> ${escapeHtml(student.note)}</div>`:''}`;
 resultZone.classList.add('show');
}
function showError(message){resultZone.innerHTML=`<div class="error-box">${escapeHtml(message)}</div>`;resultZone.classList.add('show')}
function searchStudent(){if(searchBtn.disabled)return;const wantedName=normalizeName(fullName.value),wantedCode=studentCode.value.trim();const student=STUDENTS.find(item=>normalizeName(item.name)===wantedName&&item.code===wantedCode);if(student)showStudent(student);else showError('Không tìm thấy kết quả phù hợp. Vui lòng kiểm tra lại họ và tên hoặc mã số.');newCaptcha()}
[fullName,studentCode,captchaInput].forEach(el=>{el.addEventListener('input',updateButton);el.addEventListener('keydown',event=>{if(event.key==='Enter'&&!searchBtn.disabled)searchStudent()})});refreshCaptcha.addEventListener('click',newCaptcha);searchBtn.addEventListener('click',searchStudent);newCaptcha();
</script></body></html>
